<!doctype html><meta charset=utf-8><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1920px;height:1080px;overflow:hidden;position:relative;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 background:url(sky_bg.png) top left/1920px 1100px}
.stars{position:absolute;inset:0}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7}
.sil{position:absolute;left:0;right:0;bottom:0;height:300px}
.moon{position:absolute;left:120px;top:90px;width:90px;height:90px;border-radius:50%;box-shadow:inset -22px 8px 0 0 #f6e3b4;transform:rotate(-20deg);filter:drop-shadow(0 0 30px rgba(255,220,150,.5))}
.left{position:absolute;left:130px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center}
.arch{width:300px;height:300px;margin-left:-20px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));margin:0 0 6px -14px}
h1{margin:0;font-size:300px;line-height:.95;font-weight:700;letter-spacing:.03em;color:#efd3a6;text-shadow:0 4px 0 #7a4f2a,0 9px 0 #4a2c14,0 0 70px rgba(255,170,80,.5);margin-left:-8px}
h2{margin:18px 0 0;font-size:58px;font-weight:600;font-style:italic;letter-spacing:.2em;color:#e5c797;text-shadow:0 2px 12px rgba(5,5,25,.9)}
.chips{display:flex;gap:18px;margin-top:46px}
.chips span{font-size:34px;color:#ecd29d;padding:10px 28px 12px;border-radius:10px;border:2.5px solid transparent;letter-spacing:.04em;
 background:linear-gradient(#1b1238,#120b2a) padding-box,linear-gradient(150deg,#f3d58a,#8f5f22) border-box;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.shot{position:absolute;right:120px;top:50%;width:780px;height:calc(780px*1030/1040);transform:translateY(-50%) rotate(2.5deg);border-radius:26px;overflow:hidden;
 box-shadow:0 0 0 3px #3c2410,0 40px 80px rgba(0,0,0,.65),0 0 140px rgba(255,150,60,.35)}
.shot img{width:100%;height:100%;display:block}
</style>
<body>
<div class=left><img class=arch src="arch_only.svg"><h1>Jaali</h1><h2>Lattice Puzzle</h2><div class=chips><span>Classic</span><span>Daily Jaali</span><span>Day streak</span></div></div>
<div class=shot><img src="boardonly_clear.png"></div>
